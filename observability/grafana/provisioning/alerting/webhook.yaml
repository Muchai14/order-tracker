apiVersion: 1
contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [alertname]
    group_wait: 0s
    group_interval: 1m
    repeat_interval: 4h

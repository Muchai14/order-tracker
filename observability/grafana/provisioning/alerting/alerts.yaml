apiVersion: 1
groups:
  - orgId: 1
    name: order-errors
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-lookup-5xx
        title: Order lookup server errors
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Order lookup returned a server error
          endpoint: /api/orders/{order_id}
          window: 5m
          dashboard: http://localhost:3000/d/orders
          __dashboardUid__: orders
          __panelId__: "2"
        labels:
          service: order-tracker
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: 'sum(increase(order_lookup_requests_total{http_route="/api/orders/{order_id}",http_response_status_code=~"5.."}[5m])) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
